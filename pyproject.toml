[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnnamon"
version = "0.1.1"
authors = [
  { name="Panagiotis Xiropotamos", email="panosxirop4@gmail.com" },
]
description = "CNNAMON is a modular Python framework for building, training, and interpreting 1D Convolutional Neural Networks (CNNs) for DNA sequence analysis. It integrates data preparation, model construction, and rich explainability tools in a unified and flexible system tailored for genomics research."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
"absl_py==2.1.0",
"joblib==1.2.0",
"logomaker==0.8.7",
"matplotlib==3.10.8",
"numpy==2.4.2",
"pandas==3.0.0",
"pycirclize==1.10.1",
"scikit_learn==1.8.0",
"scipy==1.17.0",
"seaborn==0.13.2",
"statsmodels==0.14.4",
"tensorflow==2.20.0",
"tqdm==4.66.4",
"plotly>=5.0.0",
"kaleido>=0.2.1"
]

[project.urls]
"Homepage" = "https://github.com/GeorgakilasLab/CNNAMON"
"Bug Tracker" = "https://github.com/GeorgakilasLab/CNNAMON/issues"

[tool.setuptools.packages.find]
where = ["."]  
include = ["cnnamon*"]