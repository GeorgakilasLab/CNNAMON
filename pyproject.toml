[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnnamon"
version = "0.2.1"
authors = [
  { name="Panagiotis Xiropotamos", email="panosxirop4@gmail.com" },
]
description = "CNNAMON is a modular Python framework for building, training, and interpreting 1D Convolutional Neural Networks (CNNs) for DNA sequence analysis. It integrates data preparation, model construction, and rich explainability tools in a unified and flexible system tailored for genomics research."
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "absl-py>=1.4.0",
    "joblib>=1.2.0",
    "logomaker>=0.8.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pycirclize>=1.0.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
    "tensorflow==2.15.0",
    "keras==2.15.0",
    "tqdm>=4.65.0",
    "plotly>=5.15.0",
    "kaleido>=0.2.1",
    "protobuf>=3.20.0"
]

[project.urls]
"Homepage" = "https://github.com/GeorgakilasLab/CNNAMON"
"Bug Tracker" = "https://github.com/GeorgakilasLab/CNNAMON/issues"

[tool.setuptools.packages.find]
where = ["."]  
include = ["cnnamon*"]